06e\u0063\u0074\u0069\u006f\u006e\u0020\u0073\u0074\u0072\u0061\u0074\u0050\u006f\u0069\u0073\u0073\u006f\u006e\u0053\u0068\u0069\u0066\u0074\u0028\u0029\u0020\u007b\u000a\u0020\u0020\u0063\u006f\u006e\u0073\u0074\u0020\u007a\u0020\u003d\u0020\u007a\u0054\u0077\u006f\u0050\u0072\u006f\u0070\u006f\u0072\u0074\u0069\u006f\u006e\u0073\u0028\u0032\u0030\u002c\u0020\u0038\u0030\u0029\u003b\u000a\u0020\u0020\u0069\u0066\u0020\u0028\u007a\u0020\u003e\u003d\u0020\u0031\u002e\u0039\u0036\u0029\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0030\u003b\u000a\u0020\u0020\u0069\u0066\u0020\u0028\u007a\u0020\u003c\u003d\u0020\u002d\u0031\u002e\u0039\u0036\u0029\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0031\u003b\u000a\u0020\u0020\u0063\u006f\u006e\u0073\u0074\u0020\u0074\u0070\u0020\u003d\u0020\u0074\u0072\u0061\u006e\u0073\u0069\u0074\u0069\u006f\u006e\u0050\u0072\u006f\u0062\u0073\u0028\u0036\u0030\u0029\u003b\u000a\u0020\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0074\u0070\u002e\u0070\u0054\u0061\u0069\u0020\u003e\u003d\u0020\u0030\u002e\u0035\u0020\u003f\u0020\u0031\u0020\u003a\u0020\u0030\u003b\u000a\u007d\u000a\u0066\u0075\u006e\u0063\u0074\u0069\u006f\u006e\u0020\u0073\u0074\u0072\u0061\u0074\u0057\u0069\u006e\u0064\u006f\u0077\u005a\u0044\u0069\u0066\u0066\u0028\u0029\u0020\u007b\u000a\u0020\u0020\u0063\u006f\u006e\u0073\u0074\u0020\u007a\u0020\u003d\u0020\u007a\u0053\u0063\u006f\u0072\u0065\u004f\u0066\u0028\u0031\u0032\u0029\u003b\u000a\u0020\u0020\u0069\u0066\u0020\u0028\u007a\u0020\u003e\u003d\u0020\u0031\u002e\u0036\u0029\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0030\u003b\u000a\u0020\u0020\u0069\u0066\u0020\u0028\u007a\u0020\u003c\u003d\u0020\u002d\u0031\u002e\u0036\u0029\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0031\u003b\u000a\u0020\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0067\u0065\u0061\u0072\u0073\u005b\u0030\u005d\u003b\u000a\u007d\u000a\u0066\u0075\u006e\u0063\u0074\u0069\u006f\u006e\u0020\u0073\u0074\u0072\u0061\u007 028\u0061\u005b\u0069\u0020\u002d\u0020\u0031\u005d\u0029\u003b\u000a\u0020\u0020\u007d\u000a\u0020\u0020\u0069\u0066\u0020\u0028\u0066\u006f\u006c\u006c\u006f\u0077\u0073\u002e\u006c\u0065\u006e\u0067\u0074\u0068\u0020\u003e\u003d\u0020\u0032\u0029\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0063\u006f\u0075\u006e\u0074\u004f\u006e\u0065\u0073\u0028\u0066\u006f\u006c\u006c\u006f\u0077\u0073\u0029\u0020\u003e\u003d\u0020\u0066\u006f\u006c\u006c\u006f\u0077\u0073\u002e\u006c\u0065\u006e\u0067\u0074\u0068\u0020\u002f\u0020\u0032\u0020\u003f\u0020\u0031\u0020\u003a\u0020\u0030\u003b\u000a\u0020\u0020\u0063\u006f\u006e\u0073\u0074\u0020\u0074\u0070\u0020\u003d\u0020\u0074\u0072\u0061\u006e\u0073\u0069\u0074\u0069\u006f\u006e\u0050\u0072\u006f\u0062\u0073\u0028\u0038\u0030\u0029\u003b\u000a\u0020\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0074\u0070\u002e\u0070\u0054\u0061\u0069\u0020\u003e\u003d\u0020\u0030\u002e\u0035\u0020\u003f\u0020\u0031\u0020\u003a\u0020\u0030\u003b\u000a\u007d\u000a\u0066\u0075\u006e\u0063\u0074\u0069\u006f\u006e\u0020\u0073\u0074\u0072\u0061\u0074\u0054\u0072\u0065\u006e\u0064\u0043\u0068\u0061\u006e\u006e\u0065\u006c\u0028\u0029\u0020\u007b\u000a\u0020\u0020\u0063\u006f\u006e\u0073\u0074\u0020\u0061\u0020\u003d\u0020\u0073\u0065\u0071\u0057\u0069\u006e\u0064\u006f\u0077\u0028\u0033\u0030\u0029\u003b\u000a\u0020\u0020\u0069\u0066\u0020\u0028\u0061\u002e\u006c\u0065\u006e\u0067\u0074\u0068\u0020\u003c\u0020\u0031\u0032\u0029\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u0020\u0031\u0020\u002d\u0020\u0067\u0065\u0061\u0072\u0073\u005b\u0030\u005d\u003b\u000a\u0020\u0020\u0063\u006f\u006e\u0073\u0074\u0020\u0062\u006c\u006f\u0063\u006b\u0073\u0020\u003d\u0020\u005b\u005d\u003b\u000a\u0020\u0020\u0066\u006f\u0072\u0020\u0028\u006c\u0065\u0074\u0020\u0069\u0020\u003d\u0020\u0030\u003b\u0020\u0069\u0020\u003c\u003d\u0020\u0061\u002e\u006c\u0065\u006e\u0067\u0074\u0068\u0020\u002d\u0020\u0033\u003b\u0020\u0069\u0020\u002b\u003d\u0020\u0033\u002 020\u0072\u0065\u0074\u0075\u0072\u006e\u003b\u0020\u007d\u000a\u0020\u0020\u0069\u0066\u0020\u0028\u0063\u0075\u0072\u0072\u0065\u006e\u0074\u002e\u0070\u0072\u0065\u0064\u0020\u003d\u003d\u003d\u0020\u0031\u0029\u0020\u006c\u0065\u0066\u0074\u0056\u0061\u006c\u002e\u0063\u006c\u0061\u0073\u0073\u004c\u0069\u0073\u0074\u002e\u0061\u0064\u0064\u0028\u0022\u0062\u006c\u0069\u006e\u006b\u002d\u0067\u0072\u0065\u0065\u006e\u0022\u0029\u003b\u000a\u0020\u0020\u0065\u006c\u0073\u0065\u0020\u0072\u0069\u0067\u0068\u0074\u0056\u0061\u006c\u002e\u0063\u006c\u0061\u0073\u0073\u004c\u0069\u0073\u0074\u002e\u0061\u0064\u0064\u0028\u0022\u0062\u006c\u0069\u006e\u006b\u002d\u0072\u0065\u0064\u0022\u0029\u003b\u000a\u0020\u0020\u0070\u0068\u0069\u0065\u006e\u0054\u0065\u0078\u0074\u002e\u0069\u006e\u006e\u0065\u0072\u0048\u0054\u004d\u004c\u0020\u003d\u0020\u0022\u0023\u0022\u0020\u002b\u0020\u0063\u0075\u0072\u0072\u0065\u006e\u0074\u002e\u006e\u0065\u0078\u0074\u0050\u0068\u0069\u0065\u006e\u003b\u000a\u007d\u000a\u000a\u0066\u0075\u006e\u0063\u0074\u0069\u006f\u006e\u0020\u0075\u0070\u0064\u0061\u0074\u0065\u0050\u0061\u006e\u0065\u006c\u0028\u0029\u0020\u007b\u000a\u0020\u0020\u0069\u0066\u0020\u0028\u0021\u0063\u0075\u0072\u0072\u0065\u006e\u0074\u0029\u0020\u007b\u0020\u0068\u0069\u0073\u0074\u006f\u0072\u0079\u0054\u0065\u0078\u0074\u002e\u0069\u006e\u006e\u0065\u0072\u0048\u0054\u004d\u004c\u0020\u003d\u0020\u0022\u005b\u0020\u002d\u0020\u005d\u0022\u003b\u0020\u0069\u006e\u0066\u006f\u0042\u006f\u0078\u002e\u0069\u006e\u006e\u0065\u0072\u0048\u0054\u004d\u004c\u0020\u003d\u0020\u0022\u0110\u0041\u004e\u0047\u0020\u0043\u1eac\u0050\u0020\u004e\u0048\u1eac\u0054\u002e\u002e\u002e\u0022\u003b\u0020\u0072\u0065\u0074\u0075\u0072\u006e\u003b\u0020\u007d\u000a\u0020\u0020\u0063\u006f\u006e\u0073\u0074\u0020\u006c\u0061\u0073\u0074\u0032\u0030\u0020\u003d\u0020\u0067\u0065\u0061\u0072\u0073\u002e\u0073\u006c\u0069\u0063\u0065\u0028\u0030\u002c\u0020\u0032\u0030\u0029\u002e\u006
